# SC-DISTRIBUTION release: workspace-tools cross-compiles its one binary
# into per-OS/arch archives + checksums and publishes them as the tag's
# official GitHub release. Unlike a Go CLI, Rust's cross-compilation needs a
# real host per target OS (no single-runner GOOS/GOARCH matrix), so this
# workflow splits into a build matrix (four OS/arch cells, one archive each)
# and a publish job that combines them.
#
# Triggers on a vX.Y.Z tag push (SC-VERSIONING: bare tag, since
# workspace-tools's one Cargo package lives at the repo root; guardrail's
# tag check enforces this in ci.yml on the same push). A manual
# workflow_dispatch run defaults to dry_run: true, so a change to this file
# can be exercised without cutting a tag or touching GitHub Releases.
#
# Cargo.toml `[patch]`es bm25/frontmatter/facetquery/clikit/logkit onto
# ../ai-shared-lib/rust/* (see ci.yml's header) -- every build cell checks
# out both repos as workspace siblings (workspace-tools, ai-shared-lib) and
# builds with working-directory: workspace-tools, resolving the patch target
# the same way a local dev checkout does.
#
# This workflow re-runs the tag conformance check itself rather than
# trusting ci.yml's guardrail job: a tag push fires both workflows
# independently, and neither run gates the other, so a malformed tag
# rejected by ci.yml would otherwise still reach `gh release create` here
# undisturbed.

name: SC-DISTRIBUTION release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build archives + checksums; skip the platform release."
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  resolve-version:
    name: resolve-version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Tag conforms to SC-VERSIONING
        if: ${{ github.event_name == 'push' }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$tag' is not [v]X.Y.Z (SC-VERSIONING: tag prefix must equal this module's path from repo root, which is empty here)"
            exit 1
          fi

      # A tag push names the release directly; a manual dispatch has no tag,
      # so it synthesizes one for the archive filenames only -- dry_run
      # always skips the publish job below, so that placeholder never
      # reaches a real release.
      - name: Resolve release tag + version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v0.0.0-dryrun.${GITHUB_RUN_ID}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  build:
    name: build-${{ matrix.name }}
    needs: resolve-version
    runs-on: ${{ matrix.os }}
    # Bounds queueing on a runner label GitHub can't assign (retired/typo'd
    # image), so that failure surfaces fast instead of hanging for 24h and
    # blocking publish's needs: [build].
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_os: linux
            archive_arch: amd64
          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive_os: linux
            archive_arch: arm64
          - name: darwin-amd64
            os: macos-15-intel
            target: x86_64-apple-darwin
            archive_os: darwin
            archive_arch: amd64
          - name: darwin-arm64
            os: macos-15
            target: aarch64-apple-darwin
            archive_os: darwin
            archive_arch: arm64
    defaults:
      run:
        working-directory: workspace-tools
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: workspace-tools

      - name: Checkout ai-shared-lib sibling (Cargo.toml [patch] target)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: johnrichter/claude-shared-tooling
          token: ${{ secrets.SIBLING_REPO_TOKEN || github.token }}
          path: ai-shared-lib

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      # linux-arm64 cross-compiles from the amd64 runner; every other cell
      # builds natively on its own architecture.
      - name: Install aarch64 cross-linker
        if: ${{ matrix.target == 'aarch64-unknown-linux-gnu' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build (${{ matrix.target }})
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Archive + checksum
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          ARCHIVE_OS: ${{ matrix.archive_os }}
          ARCHIVE_ARCH: ${{ matrix.archive_arch }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/navigator" "${workdir}/navigator"
          archive="navigator_${VERSION}_${ARCHIVE_OS}_${ARCHIVE_ARCH}.tar.gz"
          tar -czf "dist-${archive}" -C "${workdir}" navigator
          mkdir -p dist
          mv "dist-${archive}" "dist/${archive}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.name }}
          path: workspace-tools/dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: publish
    needs: [resolve-version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Per-OS/arch archives + checksums
        working-directory: dist
        run: |
          sha256sum ./*.tar.gz | sed 's#\./##' | sort -k2 > checksums.txt
          ls -la

      - name: Publish the official release (per-OS/arch archives + checksums)
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ needs.resolve-version.outputs.tag }}" --title "${{ needs.resolve-version.outputs.tag }}" --generate-notes dist/*.tar.gz dist/checksums.txt

      - name: Dry-run summary
        if: ${{ github.event_name != 'push' }}
        run: |
          echo "dry-run: built archives + checksums for ${{ needs.resolve-version.outputs.tag }} -- publish skipped"
          ls -la dist
