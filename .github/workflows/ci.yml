# CI for workspace-tools: hybrid BM25 + facet/boolean search/lint over a
# repo's frontmatter-tagged files.
#
# Cargo.toml `[patch]`es bm25/frontmatter/facetquery/clikit/logkit onto
# ../ai-shared-lib/rust/* (a monorepo-development stand-in until those crates
# cut their first `rust/<name>/v0.1.0` tag -- see Cargo.toml's own comment).
# actions/checkout refuses any path outside $GITHUB_WORKSPACE, so every job
# that runs `cargo` checks out both repos as workspace siblings
# (workspace-tools, ai-shared-lib) and runs with working-directory:
# workspace-tools, which resolves the patch target at ../ai-shared-lib
# exactly as a local dev checkout does. claude-shared-tooling is public, so
# the default github.token can clone it; SIBLING_REPO_TOKEN (a PAT scoped to
# that repo) is used when set, for parity should the repo turn private.
#
# guardrail gates every other job: SC-VERSIONING (bare tag on a tag push --
# workspace-tools's one Cargo package lives at the repo root, so its tag
# carries no path prefix) and SC-DISTRIBUTION (no committed binary, every
# run -- every per-OS/arch artifact ships through release.yml instead).

name: CI

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  guardrail:
    name: guardrail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: No committed binaries (SC-DISTRIBUTION)
        run: |
          violations=()
          while IFS=$'\t' read -r meta path; do
            mode="${meta%% *}"
            [ "$mode" = "100755" ] || continue
            [ -f "$path" ] || continue
            if head -c 8000 "$path" | LC_ALL=C grep -qaP '\x00'; then
              violations+=("$path")
            fi
          done < <(git ls-files -s)
          if [ "${#violations[@]}" -gt 0 ]; then
            echo "::error::committed binary file(s) found (SC-DISTRIBUTION forbids this; distribute via release.yml instead):"
            printf '  - %s\n' "${violations[@]}"
            exit 1
          fi
          echo "no committed binary found"

      - name: Tag conforms to SC-VERSIONING (bare vX.Y.Z -- repo-root module)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$tag' is not [v]X.Y.Z (SC-VERSIONING: tag prefix must equal this module's path from repo root, which is empty here)"
            exit 1
          fi
          echo "'$tag' conforms to SC-VERSIONING"

  build-test:
    name: build-test
    runs-on: ubuntu-latest
    needs: guardrail
    defaults:
      run:
        working-directory: workspace-tools
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: workspace-tools

      - name: Checkout ai-shared-lib sibling (Cargo.toml [patch] target)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: johnrichter/claude-shared-tooling
          token: ${{ secrets.SIBLING_REPO_TOKEN || github.token }}
          path: ai-shared-lib

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo build
        run: cargo build --locked

      - name: cargo test
        run: cargo test --locked
